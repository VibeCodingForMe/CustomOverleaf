[package]
name = "latex-studio"
version = "1.0.0"
description = "Local-first LaTeX desktop editor"
authors = ["LaTeX Studio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "latex_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
walkdir = "2"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
sha2 = "0.10"
regex = "1"
similar = "2"
dirs = "6"
trash = "5"
encoding_rs = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
